[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartera-agentkit"
version = "0.1.0.dev1"
description = "Conservative repository scaffolding for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/MohammadAminDHM/agent-logistic"
Issues = "https://github.com/MohammadAminDHM/agent-logistic/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
smartera-agentkit = "smartera_agentkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartera_agentkit = ["templates/**/*", "templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
